name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 30       # Reducimos el timeout a 30 min para evitar esperas infinitas si algo se cuelga
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps # Instalamos solo chromium para optimizar tiempo y recursos en la nube

    - name: Run API Tests with Newman Reqres
      run: npx newman run postman/reqres.collection.json -e postman/reqres.environment.json

    - name: Run API Tests with Newman Petstore3
      run: npx newman run postman/petstore.collection.json -e postman/petstore3.environment.json
      
    - name: Run Playwright tests
      env:
        TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
        TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PLAYWRIGHT_JSON_OUTPUT_FILE: test-results.json
      run: npx playwright test --grep "@ci" --reporter=html,json || true
      
    # 🤖 AQUÍ INTEGRAMOS TU SOLUCIÓN PRIVADA V1.1.0
    - name: Run AI Failure Analyzer
      uses: rwechek/ai-failure-analyzer@v1.1.0
      with:
        report-path: 'test-results.json'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        AI_PROVIDER: 'google'
        GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30