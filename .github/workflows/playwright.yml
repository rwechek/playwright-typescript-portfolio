name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15        # Reducimos el timeout a 15 min para evitar esperas infinitas si algo se cuelga
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps # Instalamos solo chromium para optimizar tiempo y recursos en la nube
      
    - name: Run Playwright tests
      run: npx playwright test --project=chromium    # Ejecutamos exclusivamente el proyecto de Chromium
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30